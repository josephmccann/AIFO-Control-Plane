name: Engineering OS Test Integrity

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

jobs:
  test-integrity:
    name: Test Integrity
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    uses: josephmccann/AIFO-Control-Plane/.github/workflows/reusable-test-integrity.yml@f67cc112439009297cb02d72651e529ea716b899
    with:
      expected_workflow_sha: f67cc112439009297cb02d72651e529ea716b899
