name: Engineering OS Test Integrity

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

jobs:
  test-integrity:
    name: Test Integrity
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    uses: josephmccann/AIFO-Control-Plane/.github/workflows/reusable-test-integrity.yml@6ec2fc95c8965892f387189e05baf3c4a5c4ed4a
    with:
      expected_workflow_sha: 6ec2fc95c8965892f387189e05baf3c4a5c4ed4a
