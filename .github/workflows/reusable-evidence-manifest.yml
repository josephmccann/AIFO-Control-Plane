name: Reusable evidence manifest

on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      pull_request:
        required: true
        type: number

permissions: {}

jobs:
  producer-evidence:
    name: Producer evidence
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out immutable head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      - name: Capture unprivileged validation outputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/eos-producer"
          python3 -m unittest discover -s tests/engineering_os -p 'test_*.py' \
            >"$RUNNER_TEMP/eos-producer/unittest.txt" 2>&1
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "eos-producer"
          content = (root / "unittest.txt").read_bytes()
          value = {
              "schema_version": "1.0.0",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "pull_request": int(os.environ["PULL_REQUEST"]),
              "base_sha": os.environ["BASE_SHA"],
              "head_sha": os.environ["HEAD_SHA"],
              "artifacts": [{
                  "name": "unittest.txt",
                  "sha256": hashlib.sha256(content).hexdigest(),
                  "size_bytes": len(content),
              }],
          }
          (root / "bundle.json").write_text(
              json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}

      - name: Upload producer-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: eos-producer-${{ inputs.pull_request }}-${{ inputs.head_sha }}
          path: ${{ runner.temp }}/eos-producer
          if-no-files-found: error
          retention-days: 90

  manifest:
    name: Evidence manifest
    needs: producer-evidence
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out immutable evidence kernel
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: kernel
          persist-credentials: false

      - name: Download producer-only evidence
        uses: actions/download-artifact@v4
        with:
          name: eos-producer-${{ inputs.pull_request }}-${{ inputs.head_sha }}
          path: producer

      - name: Check out immutable base
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ inputs.base_sha }}
          path: base
          fetch-depth: 1
          persist-credentials: false

      - name: Check out immutable head for trusted analysis
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ inputs.head_sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source integrity with immutable kernel
        env:
          GH_TOKEN: ${{ github.token }}
          EVALUATED_AT: ${{ github.event.pull_request.updated_at }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/eos-validated"
          kernel/scripts/engineering-os/validate-test-integrity \
            --base-root "$GITHUB_WORKSPACE/base" \
            --head-root "$GITHUB_WORKSPACE/head" \
            --base-sha "${{ inputs.base_sha }}" \
            --head-sha "${{ inputs.head_sha }}" \
            --repository "$GITHUB_REPOSITORY" \
            --base-policy "$GITHUB_WORKSPACE/base/.aifo/engineering-os-policy.json" \
            --pull-request "${{ inputs.pull_request }}" \
            --evaluated-at "$EVALUATED_AT" \
            --output "$RUNNER_TEMP/eos-validated/test-integrity-report.json"

      - name: Validate producer artifact boundary with immutable kernel
        run: |
          set -euo pipefail
          kernel/scripts/engineering-os/validate-evidence-bundle \
            producer/bundle.json \
            producer \
            "$RUNNER_TEMP/eos-validated/producer-bundle.json" \
            --repository "$GITHUB_REPOSITORY" \
            --pull-request "${{ inputs.pull_request }}" \
            --base-sha "${{ inputs.base_sha }}" \
            --head-sha "${{ inputs.head_sha }}"

      - name: Retain validated evidence boundary
        uses: actions/upload-artifact@v4
        with:
          name: eos-evidence-${{ inputs.pull_request }}-${{ inputs.head_sha }}
          path: ${{ runner.temp }}/eos-validated
          if-no-files-found: error
          retention-days: 90
