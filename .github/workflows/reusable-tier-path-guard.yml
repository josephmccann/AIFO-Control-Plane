name: Reusable tier and path guard

on:
  workflow_call:
    inputs:
      issue_number:
        description: Authenticated mission issue number
        required: true
        type: number
      expected_workflow_sha:
        description: Exact reviewed Control Plane workflow revision
        required: true
        type: string

permissions: {}

jobs:
  caller-authorization:
    name: Authorize exact caller and workflow provenance
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail closed unless caller and workflow are authorized
        env:
          CALLER_EVENT_NAME: ${{ github.event_name }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_OWNER: ${{ github.repository_owner }}
          CALLER_REF: ${{ github.ref }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
          EXPECTED_WORKFLOW_FILE_PATH: .github/workflows/reusable-tier-path-guard.yml
          EXPECTED_CALLER_WORKFLOW_PATH: .github/workflows/eos-pull-request.yml
        run: |
          set -euo pipefail
          deny() { echo "caller authorization denied: $1" >&2; exit 1; }
          [[ "$CALLER_OWNER" == "josephmccann" ]] || deny "repository owner"
          [[ "$CALLER_REPOSITORY" == "josephmccann/AI.FO-Demo" ]] || deny "calling repository"
          [[ "$WORKFLOW_REPOSITORY" == "josephmccann/AIFO-Control-Plane" ]] || deny "workflow repository"
          [[ "$WORKFLOW_FILE_PATH" == "$EXPECTED_WORKFLOW_FILE_PATH" ]] || deny "workflow identity"
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || deny "workflow revision"
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || deny "expected evidence"
          [[ "$WORKFLOW_SHA" == "$EXPECTED_WORKFLOW_SHA" ]] || deny "workflow provenance"
          [[ "$CALLER_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || deny "caller workflow revision"
          [[ "$CALLER_EVENT_NAME" == "pull_request" ]] || deny "event"
          [[ "$CALLER_REF" =~ ^refs/pull/[1-9][0-9]*/merge$ ]] || deny "caller ref"
          [[ "$CALLER_WORKFLOW_REF" == "$CALLER_REPOSITORY/$EXPECTED_CALLER_WORKFLOW_PATH@$CALLER_REF" ]] || deny "caller workflow identity"

  guard:
    needs: caller-authorization
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Materialize immutable enforcement kernel
        uses: josephmccann/AIFO-Control-Plane/.github/actions/materialize-kernel@3f35e11b36c9ffb394c0dfbfd7cbe214145f2070
        with:
          expected_kernel_sha: 3f35e11b36c9ffb394c0dfbfd7cbe214145f2070
      - name: Check out target repository head with complete history
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: Derive complete base and head git evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test -n "$BASE_SHA" && test -n "$HEAD_SHA"
          git -C target cat-file -e "$BASE_SHA^{commit}"
          git -C target cat-file -e "$HEAD_SHA^{commit}"
          git -C target merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null
          git -C target config diff.renames false
          git -C target diff --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files.zlist"
          python3 - <<'PY'
          import json, os
          raw = open(os.path.join(os.environ["RUNNER_TEMP"], "changed-files.zlist"), "rb").read()
          if raw and not raw.endswith(b"\0"):
              raise SystemExit("incomplete NUL-delimited git diff")
          paths = [item.decode("utf-8") for item in raw.split(b"\0") if item]
          if len(paths) != len(set(paths)):
              raise SystemExit("duplicate changed path")
          json.dump(paths, open(os.path.join(os.environ["RUNNER_TEMP"], "changed-files.json"), "w", encoding="utf-8"))
          PY
          kernel/scripts/engineering-os/resolve-base-policy \
            --repository "$GITHUB_REPOSITORY" \
            --base-root "$GITHUB_WORKSPACE/target" \
            --head-root "$GITHUB_WORKSPACE/target" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --bootstrap-repository josephmccann/AI.FO-Demo \
            --bootstrap-base-sha 52ca01c7c8b034b212feede58ddcc77d9c37c388 \
            --bootstrap-policy-sha256 27f04a05fece1cfb8e85b7da641f8d3c98592ebc1d7b943be5b99fd0e3b8cf81 \
            --output "$RUNNER_TEMP/base-policy.json"
      - name: Authenticate current mission and all active mission histories
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PYTHONPATH: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > "$RUNNER_TEMP/issue.json"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" | jq 'add' > "$RUNNER_TEMP/issues.json"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" | jq '[.[].workflow_runs[]]' > "$RUNNER_TEMP/runs.json"
          mkdir -p "$RUNNER_TEMP/comments"
          while read -r number; do
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${number}/comments?per_page=100" | jq 'add' > "$RUNNER_TEMP/comments/${number}.json"
          done < <(jq -r '.[].number' "$RUNNER_TEMP/issues.json")
          cd "$GITHUB_WORKSPACE/kernel"
          python3 - <<'PY'
          import json, os
          from engineering_os.commands import discover_repository_mission_candidates, authenticate_event_history
          from engineering_os.mission import parse_issue_body
          root = os.environ["RUNNER_TEMP"]
          load = lambda name: json.load(open(os.path.join(root, name), encoding="utf-8"))
          policy, issue, issues, runs = load("base-policy.json"), load("issue.json"), load("issues.json"), load("runs.json")
          comments = {str(item["number"]): load("comments/%s.json" % item["number"]) for item in issues}
          mission = parse_issue_body(issue.get("body", ""))
          history = authenticate_event_history(comments[str(issue["number"])], mission, policy, repository=os.environ["GITHUB_REPOSITORY"], actions_runs=runs)
          if not history.allowed:
              raise SystemExit("current mission history denied: %s" % history.code)
          discovery = discover_repository_mission_candidates(issues, comments)
          if not discovery.allowed:
              raise SystemExit("repository mission discovery denied: %s" % discovery.code)
          active = []
          for candidate in discovery.candidates:
              checked = authenticate_event_history(candidate["comments"], candidate["mission"], policy, repository=os.environ["GITHUB_REPOSITORY"], actions_runs=runs)
              if not checked.allowed:
                  raise SystemExit("repository mission history denied: %s" % checked.code)
              active.append({"mission_id": candidate["mission"]["mission_id"], "state": checked.projection.state, "paths": candidate["mission"]["allowed_paths"]})
          json.dump(mission, open(os.path.join(root, "mission.json"), "w", encoding="utf-8"), sort_keys=True)
          json.dump(active, open(os.path.join(root, "active-missions.json"), "w", encoding="utf-8"), sort_keys=True)
          PY
      - name: Enforce tier from base policy
        run: |
          kernel/scripts/engineering-os/validate-tier \
            --mission "$RUNNER_TEMP/mission.json" \
            --policy "$RUNNER_TEMP/base-policy.json" \
            --changed-files "$RUNNER_TEMP/changed-files.json"
      - name: Enforce paths and semantic ownership without coordination bypass
        run: |
          kernel/scripts/engineering-os/validate-paths \
            --mission "$RUNNER_TEMP/mission.json" \
            --policy "$RUNNER_TEMP/base-policy.json" \
            --changed-files "$RUNNER_TEMP/changed-files.json" \
            --active-missions "$RUNNER_TEMP/active-missions.json"
