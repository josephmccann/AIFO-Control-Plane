name: Reusable test-integrity guard

on:
  workflow_call:

permissions: {}

jobs:
  test-integrity:
    name: Test Integrity
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out immutable enforcement kernel
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: kernel
          fetch-depth: 1
          persist-credentials: false

      - name: Check out immutable base revision
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 1
          persist-credentials: false

      - name: Check out immutable head revision
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 1
          persist-credentials: false

      - name: Derive complete test-integrity evidence
        id: integrity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVALUATED_AT: ${{ github.event.pull_request.updated_at }}
        run: |
          set +e
          kernel/scripts/engineering-os/validate-test-integrity \
            --base-root "$GITHUB_WORKSPACE/base" \
            --head-root "$GITHUB_WORKSPACE/head" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --base-policy "$GITHUB_WORKSPACE/base/.aifo/engineering-os-policy.json" \
            --evaluated-at "$EVALUATED_AT" \
            --output "$RUNNER_TEMP/test-integrity-report.json"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Retain machine-generated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eos-test-integrity-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/test-integrity-report.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce test-integrity decision
        env:
          INTEGRITY_STATUS: ${{ steps.integrity.outputs.status }}
        run: test "$INTEGRITY_STATUS" = "0"
