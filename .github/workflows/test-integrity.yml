name: Engineering OS Test Integrity

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

jobs:
  test-integrity:
    name: Test Integrity
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    uses: josephmccann/AIFO-Control-Plane/.github/workflows/reusable-test-integrity.yml@fe3a8da3d8eb3c81342cc28205de65abc969e0e2
    with:
      expected_workflow_sha: fe3a8da3d8eb3c81342cc28205de65abc969e0e2
