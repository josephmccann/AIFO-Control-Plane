name: Mission command

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: eos-mission-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event.issue.pull_request == null }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
    outputs:
      append: ${{ steps.proposal.outputs.append }}
      encoded_body: ${{ steps.proposal.outputs.encoded_body }}
      is_claim: ${{ steps.exact.outputs.command == 'claim' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Recognize one exact command
        id: exact
        continue-on-error: true
        env:
          COMMAND_BODY: ${{ github.event.comment.body }}
        run: |
          python3 - <<'PY'
          import os
          from engineering_os.commands import parse_command
          parsed = parse_command(os.environ["COMMAND_BODY"])
          if parsed is None:
              raise SystemExit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("command=%s\n" % parsed[0])
          if parsed[0] in {"authorize-baseline", "attempt-baseline", "consume-baseline"}:
              raise SystemExit("activation lifecycle requires a separately authorized activation mission")
          PY
      - name: Normalize mission and paginated comments
        if: ${{ steps.exact.outcome == 'success' && steps.exact.outputs.command != 'claim' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from engineering_os.mission import parse_issue_body
          json.dump(parse_issue_body(os.environ["ISSUE_BODY"]), open(os.path.join(os.environ["RUNNER_TEMP"], "mission.json"), "w", encoding="utf-8"))
          PY
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" | jq 'add' > "$RUNNER_TEMP/comments.json"
          python3 - <<'PY'
          import json
          import os
          import re
          from engineering_os.commands import _EVENT_MARKER
          repository = os.environ["GITHUB_REPOSITORY"]
          comments = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "comments.json"), encoding="utf-8"))
          run_ids = set()
          pattern = re.compile(r"https://github\.com/%s/actions/runs/([1-9][0-9]*)" % re.escape(repository))
          for comment in comments:
              for match in _EVENT_MARKER.finditer(comment.get("body", "")):
                  try:
                      event = json.loads(match.group(1))
                  except json.JSONDecodeError:
                      continue
                  source = event.get("source_url") if isinstance(event, dict) else None
                  found = pattern.fullmatch(source or "")
                  if found:
                      run_ids.add(int(found.group(1)))
          with open(os.path.join(os.environ["RUNNER_TEMP"], "run-ids.txt"), "w", encoding="utf-8") as stream:
              stream.writelines("%s\n" % run_id for run_id in sorted(run_ids))
          PY
          printf '%s\n' "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/run-ids.txt"
          : > "$RUNNER_TEMP/runs.ndjson"
          while read -r run_id; do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >> "$RUNNER_TEMP/runs.ndjson"
          done < "$RUNNER_TEMP/run-ids.txt"
          if [[ -s "$RUNNER_TEMP/runs.ndjson" ]]; then jq -s '.' "$RUNNER_TEMP/runs.ndjson" > "$RUNNER_TEMP/runs.json"; else printf '[]\n' > "$RUNNER_TEMP/runs.json"; fi
      - name: Authenticate history and authorize proposal
        id: proposal
        if: ${{ steps.exact.outcome == 'success' && steps.exact.outputs.command != 'claim' }}
        env:
          COMMAND_URL: ${{ github.event.comment.html_url }}
          COMMAND_BODY: ${{ github.event.comment.body }}
          GITHUB_EVENT_ISSUE: ${{ toJSON(github.event.issue) }}
        run: |
          python3 -m engineering_os.commands authenticate-event-history \
            --comments "$RUNNER_TEMP/comments.json" \
            --mission "$RUNNER_TEMP/mission.json" \
            --policy .aifo/engineering-os-policy.json \
            --runs "$RUNNER_TEMP/runs.json" \
            --repository "$GITHUB_REPOSITORY" \
            --events-output "$RUNNER_TEMP/events.json"
          python3 - <<'PY'
          import json, os
          from engineering_os.commands import validate_activation_ledger
          events = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "events.json"), encoding="utf-8")) if os.path.exists(os.path.join(os.environ["RUNNER_TEMP"], "events.json")) else []
          activations = [event for event in events if event.get("type") == "test_integrity.baseline.authorized"]
          if activations:
              ok, code, _ = validate_activation_ledger(events, activations[0]["details"], repository=os.environ["GITHUB_REPOSITORY"])
              if not ok:
                  raise SystemExit(code)
          PY
          activation_args=()
          activation_source_args=()
          if [[ "$COMMAND_BODY" == /eos\ authorize-baseline\ * || "$COMMAND_BODY" == /eos\ attempt-baseline\ * || "$COMMAND_BODY" == /eos\ consume-baseline\ * ]]; then
            COMMAND_BODY="$COMMAND_BODY" python3 - <<'PY'
          import json, os
          from engineering_os.commands import parse_command
          parsed = parse_command(os.environ["COMMAND_BODY"])
          if parsed is None:
              raise SystemExit("invalid activation command")
          nonce = parsed[1][0]
          events = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "events.json"), encoding="utf-8"))
          ready = next((event for event in events if event.get("type") == "mission.ready"), None)
          if ready is None:
              raise SystemExit("authenticated Mission 26 Ready event is required")
          import subprocess
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          issue = json.loads(os.environ["GITHUB_EVENT_ISSUE"])
          provenance = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_path": ".github/workflows/mission-command.yml",
              "workflow_ref": "%s/.github/workflows/mission-command.yml@%s" % (os.environ["GITHUB_REPOSITORY"], head),
              "workflow_sha": head, "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "job": "prepare" if parsed[0] == "authorize-baseline" else "append",
              "actor": "github-actions[bot]", "trigger_actor": os.environ["GITHUB_ACTOR"],
              "event": "issue_comment", "head_sha": head, "head_tree": tree,
          }
          details = {
              "repository": "josephmccann/AIFO-Control-Plane", "mission_issue": 26,
              "mission_issue_identity": {
                  "repository": os.environ["GITHUB_REPOSITORY"], "number": issue["number"],
                  "node_id": issue["node_id"], "url": issue["html_url"], "state": issue["state"],
                  "ready_event_hash": ready["event_hash"], "ready_sequence": ready["sequence"],
                  "ready_declaration_sha256": ready["details"]["mission_sha256"],
              },
              "authorization_provenance": provenance,
              "remediation_head": "b3c0a2c7c85fbd45167d61ae29fc1f21dfafad9e",
              "remediation_tree": "9fd7af9c8f231759ebbee851836dd83a097418d6",
              "baseline_artifact_sha256": "3bd53aa718599ae33a5093b5b5c6e1d416216631e7818acf5472128ea9e38bce",
              "canonical_inventory_sha256": "23211f7a871c8a9a9f15cb5c010fd5167a1f21314bceebe43c2a38d8d1f04c0e",
              "baseline_generator_identity": "engineering_os.test_integrity_cli:initial-baseline-v1",
              "analyzer_identity": "engineering_os.test_integrity_cli:b3c0a2c7",
              "workflow_identity": "reusable-test-integrity@b3142f5bbed547a97a70f29bda33682294948aed",
              "caller_identity": "test-integrity-caller@80256915bdca989edc7580898971dbad1b199170",
              "immutable_kernel_identity": "5a273627a1a4d4addfcf81129dcdbda4dc58c383",
              "manifest_identity": "db1f444bad41ecf1db5057c8cbbae6390ffb7f5f7477e0c7a3bd8ae35a7a6dab",
              "rollback_sha": "77af0e93780134349abb15bd8d8b665c6de939a3",
              "activation_nonce": nonce, "activation_type": "initial_test_integrity_baseline",
              "single_use": True, "founder_authorization_identity": "josephmccann",
              "founder_authorization_sequence": len(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "events.json")))) + 1,
          }
          if parsed[0] != "authorize-baseline":
              existing = next((event for event in events if event.get("type") == "test_integrity.baseline.authorized"), None)
              if not existing:
                  raise SystemExit("activation authorization is required before consumption")
              details = dict(existing["details"])
              if details.get("activation_nonce") != nonce:
                  raise SystemExit("activation nonce does not match the authorized tuple")
              details["consumer_provenance"] = provenance
          json.dump(details, open(os.path.join(os.environ["RUNNER_TEMP"], "activation.json"), "w"), sort_keys=True)
          PY
            activation_args=(--activation "$RUNNER_TEMP/activation.json")
            activation_source_args=(--activation-source-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
          fi
          python3 -m engineering_os.commands propose-command \
            --comments "$RUNNER_TEMP/comments.json" \
            --mission "$RUNNER_TEMP/mission.json" \
            --policy .aifo/engineering-os-policy.json \
            --runs "$RUNNER_TEMP/runs.json" \
            --repository "$GITHUB_REPOSITORY" \
            --command-comment-url "$COMMAND_URL" \
            --body-output "$RUNNER_TEMP/event-body.txt" \
            "${activation_args[@]}" \
            "${activation_source_args[@]}"
          {
            printf 'append=true\n'
            printf 'encoded_body=%s\n' "$(base64 < "$RUNNER_TEMP/event-body.txt" | tr -d '\n')"
          } >> "$GITHUB_OUTPUT"

  append:
    needs: prepare
    if: ${{ needs.prepare.outputs.append == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Re-fetch and re-authenticate the complete history before append
        env:
          ENCODED_BODY: ${{ needs.prepare.outputs.encoded_body }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          body="$(printf '%s' "$ENCODED_BODY" | base64 --decode)"
          printf '%s' "$body" > "$RUNNER_TEMP/proposed-event.txt"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > "$RUNNER_TEMP/issue.json"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" | jq 'add' > "$RUNNER_TEMP/comments.json"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" | jq '[.[].workflow_runs[]]' > "$RUNNER_TEMP/runs.json"
          python3 - <<'PY'
          import json
          import os
          from engineering_os.commands import authenticate_event_history, validate_activation_ledger
          from engineering_os.mission import parse_issue_body

          root = os.environ["RUNNER_TEMP"]
          issue = json.load(open(os.path.join(root, "issue.json"), encoding="utf-8"))
          comments = json.load(open(os.path.join(root, "comments.json"), encoding="utf-8"))
          runs = json.load(open(os.path.join(root, "runs.json"), encoding="utf-8"))
          body = open(os.path.join(root, "proposed-event.txt"), encoding="utf-8").read()
          events = []
          import re
          for match in re.finditer(r"<!-- EOS:EVENT:BEGIN -->\s*(\{.*?\})\s*<!-- EOS:EVENT:END -->", body, re.S):
              events.append(json.loads(match.group(1)))
          if len(events) != 1:
              raise SystemExit("append proposal must contain exactly one event")
          event = events[0]
          comments.append({
              "body": body,
              "created_at": event["occurred_at"],
              "html_url": "https://github.com/%s/issues/%s#eos-preappend-%s" % (
                  os.environ["GITHUB_REPOSITORY"], os.environ["ISSUE_NUMBER"], event["event_hash"]
              ),
              "user": {"login": "github-actions[bot]"},
          })
          mission = parse_issue_body(issue.get("body", ""))
          policy = json.load(open(".aifo/engineering-os-policy.json", encoding="utf-8"))
          decision = authenticate_event_history(
              comments, mission, policy,
              repository=os.environ["GITHUB_REPOSITORY"], actions_runs=runs,
          )
          if not decision.allowed or decision.projection.violations:
              raise SystemExit("pre-append history rejected: %s" % decision.code)
          if event["type"].startswith("test_integrity.baseline."):
              identity = event["details"].get("mission_issue_identity", {})
              if identity != {
                  **identity, "repository": os.environ["GITHUB_REPOSITORY"],
                  "number": issue.get("number"), "node_id": issue.get("node_id"),
                  "url": issue.get("html_url"), "state": issue.get("state"),
              }:
                  raise SystemExit("activation issue identity is stale or contradictory")
              provenance = event["details"].get(
                  "consumer_provenance" if event["type"] != "test_integrity.baseline.authorized"
                  else "authorization_provenance", {})
              import subprocess
              if (provenance.get("head_sha") != subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
                      or provenance.get("head_tree") != subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
                      or provenance.get("run_id") != int(os.environ["GITHUB_RUN_ID"])
                      or provenance.get("run_attempt") != int(os.environ["GITHUB_RUN_ATTEMPT"])):
                  raise SystemExit("activation checkout/run provenance changed before append")
              activation = next((item for item in decision.events if item.get("type") == "test_integrity.baseline.authorized"), None)
              if event["type"] != "test_integrity.baseline.authorized" and activation is None:
                  raise SystemExit("activation authorization missing at append boundary")
              if activation:
                  ok, code, _ = validate_activation_ledger(
                      list(decision.events), activation["details"],
                      repository=os.environ["GITHUB_REPOSITORY"],
                  )
                  if not ok:
                      raise SystemExit(code)
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="$body" >/dev/null

  claim:
    needs: prepare
    if: ${{ needs.prepare.outputs.is_claim == 'true' }}
    concurrency:
      group: eos-claim-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Re-fetch all-state mission histories and authorize claim under repository lock
        env:
          COMMAND_URL: ${{ github.event.comment.html_url }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "issue number must be a positive integer" >&2; exit 1; }
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" | jq 'add' > "$RUNNER_TEMP/all-issues.json"
          : > "$RUNNER_TEMP/comments-index.ndjson"
          jq -r '.[].number' "$RUNNER_TEMP/all-issues.json" | while read -r issue; do
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${issue}/comments?per_page=100" | jq 'add' > "$RUNNER_TEMP/comments-${issue}.json"
            jq -n --arg issue "$issue" --slurpfile comments "$RUNNER_TEMP/comments-${issue}.json" \
              '{($issue):$comments[0]}' >> "$RUNNER_TEMP/comments-index.ndjson"
          done
          jq -s 'reduce .[] as $item ({}; . + $item)' "$RUNNER_TEMP/comments-index.ndjson" > "$RUNNER_TEMP/comments-by-issue.json"
          python3 - <<'PY'
          import json
          import os
          from engineering_os.commands import discover_repository_mission_candidates

          issues = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "all-issues.json"), encoding="utf-8"))
          comments = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "comments-by-issue.json"), encoding="utf-8"))
          # Event-bearing <!-- EOS:EVENT:BEGIN --> issues remain candidates even when <!-- EOS:MISSION:BEGIN --> markers were removed.
          discovery = discover_repository_mission_candidates(issues, comments)
          if not discovery.allowed:
              raise SystemExit("%s: %s" % (discovery.code, discovery.details))
          with open(os.path.join(os.environ["RUNNER_TEMP"], "candidate-seeds.json"), "w", encoding="utf-8") as stream:
              json.dump(list(discovery.candidates), stream, sort_keys=True, separators=(",", ":"))
          PY
          : > "$RUNNER_TEMP/candidates.ndjson"
          jq -r '.[].issue_number' "$RUNNER_TEMP/candidate-seeds.json" | while read -r issue; do
            jq --argjson issue "$issue" '.[] | select(.issue_number == $issue) | .comments' \
              "$RUNNER_TEMP/candidate-seeds.json" > "$RUNNER_TEMP/comments-${issue}.json"
            ISSUE="$issue" python3 - <<'PY'
          import json
          import os
          import re
          from engineering_os.commands import _EVENT_MARKER

          issue = os.environ["ISSUE"]
          comments = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "comments-%s.json" % issue), encoding="utf-8"))
          pattern = re.compile(r"https://github\.com/%s/actions/runs/([1-9][0-9]*)" % re.escape(os.environ["GITHUB_REPOSITORY"]))
          run_ids = set()
          for comment in comments:
              for marker in _EVENT_MARKER.finditer(comment.get("body", "")):
                  try:
                      event = json.loads(marker.group(1))
                  except json.JSONDecodeError:
                      continue
                  found = pattern.fullmatch(event.get("source_url", "") if isinstance(event, dict) else "")
                  if found:
                      run_ids.add(int(found.group(1)))
          with open(os.path.join(os.environ["RUNNER_TEMP"], "run-ids-%s.txt" % issue), "w", encoding="utf-8") as stream:
              stream.writelines("%s\n" % run_id for run_id in sorted(run_ids))
          PY
            : > "$RUNNER_TEMP/runs-${issue}.ndjson"
            while read -r run_id; do
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >> "$RUNNER_TEMP/runs-${issue}.ndjson"
            done < "$RUNNER_TEMP/run-ids-${issue}.txt"
            if [[ -s "$RUNNER_TEMP/runs-${issue}.ndjson" ]]; then jq -s '.' "$RUNNER_TEMP/runs-${issue}.ndjson" > "$RUNNER_TEMP/runs-${issue}.json"; else printf '[]\n' > "$RUNNER_TEMP/runs-${issue}.json"; fi
            jq --argjson issue "$issue" \
              --slurpfile comments "$RUNNER_TEMP/comments-${issue}.json" \
              --slurpfile runs "$RUNNER_TEMP/runs-${issue}.json" \
              '.[] | select(.issue_number == $issue) | . + {comments:$comments[0], actions_runs:$runs[0]}' \
              "$RUNNER_TEMP/candidate-seeds.json" >> "$RUNNER_TEMP/candidates.ndjson"
          done
          jq -s '.' "$RUNNER_TEMP/candidates.ndjson" > "$RUNNER_TEMP/candidates.json"
          matches="$(jq --argjson issue "$ISSUE_NUMBER" '[.[] | select(.issue_number == $issue)] | length' "$RUNNER_TEMP/candidates.json")"
          [[ "$matches" == "1" ]] || { echo "current issue is not exactly one state-independent EOS mission" >&2; exit 1; }
          jq --argjson issue "$ISSUE_NUMBER" '.[] | select(.issue_number == $issue) | .mission' "$RUNNER_TEMP/candidates.json" > "$RUNNER_TEMP/mission.json"
          jq --argjson issue "$ISSUE_NUMBER" '.[] | select(.issue_number == $issue) | .comments' "$RUNNER_TEMP/candidates.json" > "$RUNNER_TEMP/comments.json"
          jq --argjson issue "$ISSUE_NUMBER" '.[] | select(.issue_number == $issue) | .actions_runs' "$RUNNER_TEMP/candidates.json" > "$RUNNER_TEMP/runs.json"
          python3 -m engineering_os.commands authenticate-repository-leases \
            --candidates "$RUNNER_TEMP/candidates.json" \
            --policy .aifo/engineering-os-policy.json \
            --repository "$GITHUB_REPOSITORY" \
            --events-output "$RUNNER_TEMP/repository-leases.json"
          python3 -m engineering_os.commands propose-command \
            --comments "$RUNNER_TEMP/comments.json" \
            --mission "$RUNNER_TEMP/mission.json" \
            --policy .aifo/engineering-os-policy.json \
            --runs "$RUNNER_TEMP/runs.json" \
            --repository-leases "$RUNNER_TEMP/repository-leases.json" \
            --repository "$GITHUB_REPOSITORY" \
            --command-comment-url "$COMMAND_URL" \
            --body-output "$RUNNER_TEMP/event-body.txt"
          body="$(< "$RUNNER_TEMP/event-body.txt")"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="$body" >/dev/null
