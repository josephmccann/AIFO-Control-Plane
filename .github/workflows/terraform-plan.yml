name: Terraform Plan

on:
  pull_request:
    paths:
      - ".github/workflows/terraform-plan.yml"
      - "terraform/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: read

env:
  AWS_REGION: us-west-2
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: Plan control-plane Terraform
    runs-on: ubuntu-latest
    if: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN != '' && vars.TF_BACKEND_BUCKET != '' && vars.TF_BACKEND_KEY != '' }}
    environment: terraform-plan

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          role-session-name: aifo-control-plane-plan

      - name: Terraform format
        run: terraform fmt -check -recursive terraform

      - name: Terraform init
        working-directory: terraform/environments/control-plane
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ vars.TF_BACKEND_BUCKET }}" \
            -backend-config="key=${{ vars.TF_BACKEND_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform validate
        working-directory: terraform/environments/control-plane
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        working-directory: terraform/environments/control-plane
        run: |
          plan_output="$(mktemp)"
          set +e
          terraform plan -no-color -input=false -detailed-exitcode 2>&1 | tee "$plan_output"
          exit_code=${PIPESTATUS[0]}
          set -e

          add_count=0
          change_count=0
          destroy_count=0
          plan_summary="$(grep -E '^Plan: [0-9]+ to add, [0-9]+ to change, [0-9]+ to destroy\.$' "$plan_output" | tail -n 1 || true)"

          if [ -n "$plan_summary" ]; then
            add_count="$(printf '%s\n' "$plan_summary" | sed -E 's/^Plan: ([0-9]+) to add, ([0-9]+) to change, ([0-9]+) to destroy\.$/\1/')"
            change_count="$(printf '%s\n' "$plan_summary" | sed -E 's/^Plan: ([0-9]+) to add, ([0-9]+) to change, ([0-9]+) to destroy\.$/\2/')"
            destroy_count="$(printf '%s\n' "$plan_summary" | sed -E 's/^Plan: ([0-9]+) to add, ([0-9]+) to change, ([0-9]+) to destroy\.$/\3/')"
          fi

          if [ "$exit_code" -eq 0 ]; then
            result="clean"
          elif [ "$exit_code" -eq 2 ]; then
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              result="proposed change"
            else
              result="unexpected drift"
            fi
          else
            result="plan failed"
          fi

          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          echo "add_count=${add_count}" >> "$GITHUB_OUTPUT"
          echo "change_count=${change_count}" >> "$GITHUB_OUTPUT"
          echo "destroy_count=${destroy_count}" >> "$GITHUB_OUTPUT"
          echo "result=${result}" >> "$GITHUB_OUTPUT"

          {
            echo "## Terraform Plan Summary"
            echo
            echo "- Terraform exit code: \`${exit_code}\`"
            echo "- Adds: \`${add_count}\`"
            echo "- Changes: \`${change_count}\`"
            echo "- Destroys: \`${destroy_count}\`"
            echo "- Result: \`${result}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$exit_code" -eq 1 ]; then
            exit 1
          fi

          if [ "$exit_code" -eq 2 ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "::error::Terraform proposed changes during a main/manual verification run. Main must match deployed infrastructure."
            exit 1
          fi

          exit 0
