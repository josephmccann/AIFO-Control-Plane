name: Engineering OS Test Integrity

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

jobs:
  test-integrity:
    name: Test Integrity
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    uses: josephmccann/AIFO-Control-Plane/.github/workflows/reusable-test-integrity.yml@a100e3eef7c2d0d65eb320ad37b2133d7ed74608
    with:
      expected_workflow_sha: a100e3eef7c2d0d65eb320ad37b2133d7ed74608
