name: Reusable evidence manifest

on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      pull_request:
        required: true
        type: number

permissions: {}

jobs:
  producer-evidence:
    name: Producer evidence
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out immutable head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      - name: Capture unprivileged validation outputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/eos-producer"
          python3 -m unittest discover -s tests/engineering_os -p 'test_*.py' \
            >"$RUNNER_TEMP/eos-producer/unittest.txt" 2>&1
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "eos-producer"
          value = {
              "schema_version": "1.0.0",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "pull_request": int(os.environ["PULL_REQUEST"]),
              "base_sha": os.environ["BASE_SHA"],
              "head_sha": os.environ["HEAD_SHA"],
              "artifacts": ["unittest.txt"],
          }
          (root / "bundle.json").write_text(
              json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}

      - name: Upload producer-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: eos-producer-${{ inputs.pull_request }}-${{ inputs.head_sha }}
          path: ${{ runner.temp }}/eos-producer
          if-no-files-found: error
          retention-days: 90

  manifest:
    name: Evidence manifest
    needs: producer-evidence
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out immutable evidence kernel
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: kernel
          persist-credentials: false

      - name: Download producer-only evidence
        uses: actions/download-artifact@v4
        with:
          name: eos-producer-${{ inputs.pull_request }}-${{ inputs.head_sha }}
          path: producer

      - name: Validate artifact boundary
        run: |
          set -euo pipefail
          test -f producer/bundle.json
          test -f producer/unittest.txt

      - name: Retain validated evidence boundary
        uses: actions/upload-artifact@v4
        with:
          name: eos-evidence-${{ inputs.pull_request }}-${{ inputs.head_sha }}
          path: producer
          if-no-files-found: error
          retention-days: 90
