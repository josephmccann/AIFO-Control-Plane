name: Reusable orphan recovery

on:
  workflow_call:
    inputs:
      issue_number:
        description: Mission issue number; required for mutation
        required: false
        default: 0
        type: number
      dry_run:
        description: Discover and report only
        required: false
        default: true
        type: boolean
      expected_workflow_sha:
        description: Exact reviewed Control Plane workflow revision
        required: true
        type: string
  workflow_dispatch:
    inputs:
      issue_number:
        description: Mission issue number; required for mutation
        required: false
        type: string
      dry_run:
        description: Discover and report only
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "17 * * * *"

permissions: {}

concurrency:
  group: eos-mission-${{ github.repository }}-${{ inputs.issue_number || 'scheduled-dry-run' }}
  cancel-in-progress: false

jobs:
  caller-authorization:
    name: Authorize exact caller and workflow provenance
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail closed unless caller and workflow are authorized
        env:
          CALLER_EVENT_NAME: ${{ github.event_name }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_OWNER: ${{ github.repository_owner }}
          CALLER_REF: ${{ github.ref }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
          EXPECTED_WORKFLOW_FILE_PATH: .github/workflows/reusable-orphan-recovery.yml
          EXPECTED_CALLER_WORKFLOW_PATH: .github/workflows/eos-orphan-recovery.yml
        run: |
          set -euo pipefail
          deny() { echo "caller authorization denied: $1" >&2; exit 1; }
          [[ "$CALLER_OWNER" == "josephmccann" ]] || deny "repository owner"
          [[ "$WORKFLOW_REPOSITORY" == "josephmccann/AIFO-Control-Plane" ]] || deny "workflow repository"
          [[ "$WORKFLOW_FILE_PATH" == "$EXPECTED_WORKFLOW_FILE_PATH" ]] || deny "workflow identity"
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || deny "workflow revision"
          [[ "$CALLER_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || deny "caller workflow revision"
          if [[ "$CALLER_REPOSITORY" == "josephmccann/AI.FO-Demo" ]]; then
            [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || deny "expected evidence"
            [[ "$WORKFLOW_SHA" == "$EXPECTED_WORKFLOW_SHA" ]] || deny "workflow provenance"
            [[ "$CALLER_EVENT_NAME" == "schedule" || "$CALLER_EVENT_NAME" == "workflow_dispatch" ]] || deny "event"
            [[ "$CALLER_REF" == "refs/heads/master" ]] || deny "caller ref"
            [[ "$CALLER_WORKFLOW_REF" == "$CALLER_REPOSITORY/$EXPECTED_CALLER_WORKFLOW_PATH@$CALLER_REF" ]] || deny "caller workflow identity"
          elif [[ "$CALLER_REPOSITORY" == "josephmccann/AIFO-Control-Plane" &&
                  ( "$CALLER_EVENT_NAME" == "schedule" || "$CALLER_EVENT_NAME" == "workflow_dispatch" ) ]]; then
            [[ "$CALLER_REF" == "refs/heads/main" ]] || deny "direct ref"
            [[ "$CALLER_WORKFLOW_REF" == "$CALLER_REPOSITORY/$EXPECTED_WORKFLOW_FILE_PATH@$CALLER_REF" ]] || deny "direct workflow identity"
            [[ "$CALLER_WORKFLOW_SHA" == "$WORKFLOW_SHA" ]] || deny "direct workflow provenance"
            [[ -z "$EXPECTED_WORKFLOW_SHA" ]] || deny "unexpected direct evidence"
          else
            deny "calling repository"
          fi

  policy:
    needs: caller-authorization
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.policy.outputs.enabled }}
    steps:
      - name: Materialize immutable enforcement kernel
        uses: josephmccann/AIFO-Control-Plane/.github/actions/materialize-kernel@672160e2e2e1bbf783e3b4ff5d5771a2806a4e35
        with:
          expected_kernel_sha: 672160e2e2e1bbf783e3b4ff5d5771a2806a4e35
      - name: Check out target repository default branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          path: target
          fetch-depth: 1
          persist-credentials: false
      - id: policy
        name: Read versioned recovery policy from the default branch
        env:
          PYTHONPATH: ${{ github.workspace }}/kernel
        run: |
          python3 - <<'PY'
          import json
          import os
          from engineering_os.schema import validate_document
          policy = json.load(open("target/.aifo/engineering-os-policy.json", encoding="utf-8"))
          if validate_document("repository-policy", policy):
              raise SystemExit("repository policy is invalid")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("enabled=%s\n" % str(policy["orphan_recovery_enabled"]).lower())
          PY

  discover:
    needs: policy
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
    steps:
      - name: Materialize immutable enforcement kernel
        uses: josephmccann/AIFO-Control-Plane/.github/actions/materialize-kernel@672160e2e2e1bbf783e3b4ff5d5771a2806a4e35
        with:
          expected_kernel_sha: 672160e2e2e1bbf783e3b4ff5d5771a2806a4e35
      - name: Check out target repository default branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          path: target
          fetch-depth: 1
          persist-credentials: false
      - name: Scheduled and default dry-run discovery
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/kernel
          REQUESTED_ISSUE: ${{ inputs.issue_number }}
        run: |
          if [[ -n "$REQUESTED_ISSUE" && "$REQUESTED_ISSUE" != "0" ]]; then
            [[ "$REQUESTED_ISSUE" =~ ^[1-9][0-9]*$ ]] || { echo "issue number must be a positive integer" >&2; exit 1; }
            printf '[{"number":%s}]\n' "$REQUESTED_ISSUE" > "$RUNNER_TEMP/issues.json"
          else
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" | jq 'add' > "$RUNNER_TEMP/issues.json"
            jq '[.[] | select(has("pull_request") | not) | select((.body // "") | contains("<!-- EOS:MISSION:BEGIN -->"))]' \
              "$RUNNER_TEMP/issues.json" > "$RUNNER_TEMP/mission-issues.json"
            mv "$RUNNER_TEMP/mission-issues.json" "$RUNNER_TEMP/issues.json"
          fi
          printf '%s\n' '{"dry_run":true,"mutation_performed":false}' >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[].number' "$RUNNER_TEMP/issues.json" | while read -r issue; do
            gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}" > "$RUNNER_TEMP/issue-${issue}.json"
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${issue}/comments" | jq 'add' > "$RUNNER_TEMP/comments-${issue}.json"
            ISSUE="$issue" python3 - <<'PY'
          import json
          import os
          import re
          from engineering_os.commands import _EVENT_MARKER
          from engineering_os.mission import parse_issue_body
          issue = os.environ["ISSUE"]
          record = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "issue-%s.json" % issue), encoding="utf-8"))
          json.dump(parse_issue_body(record["body"]), open(os.path.join(os.environ["RUNNER_TEMP"], "mission-%s.json" % issue), "w", encoding="utf-8"))
          comments = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "comments-%s.json" % issue), encoding="utf-8"))
          pattern = re.compile(r"https://github\.com/%s/actions/runs/([1-9][0-9]*)" % re.escape(os.environ["GITHUB_REPOSITORY"]))
          run_ids = set()
          for comment in comments:
              for match in _EVENT_MARKER.finditer(comment.get("body", "")):
                  try:
                      event = json.loads(match.group(1))
                  except json.JSONDecodeError:
                      continue
                  found = pattern.fullmatch(event.get("source_url", "") if isinstance(event, dict) else "")
                  if found:
                      run_ids.add(int(found.group(1)))
          with open(os.path.join(os.environ["RUNNER_TEMP"], "run-ids-%s.txt" % issue), "w", encoding="utf-8") as stream:
              stream.writelines("%s\n" % run_id for run_id in sorted(run_ids))
          PY
            : > "$RUNNER_TEMP/runs-${issue}.ndjson"
            while read -r run_id; do
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >> "$RUNNER_TEMP/runs-${issue}.ndjson"
            done < "$RUNNER_TEMP/run-ids-${issue}.txt"
            if [[ -s "$RUNNER_TEMP/runs-${issue}.ndjson" ]]; then jq -s '.' "$RUNNER_TEMP/runs-${issue}.ndjson" > "$RUNNER_TEMP/runs-${issue}.json"; else printf '[]\n' > "$RUNNER_TEMP/runs-${issue}.json"; fi
            python3 -m engineering_os.commands authenticate-event-history \
              --comments "$RUNNER_TEMP/comments-${issue}.json" \
              --mission "$RUNNER_TEMP/mission-${issue}.json" \
              --policy target/.aifo/engineering-os-policy.json \
              --runs "$RUNNER_TEMP/runs-${issue}.json" \
              --repository "$GITHUB_REPOSITORY" \
              --events-output "$RUNNER_TEMP/events-${issue}.json"
            kernel/scripts/engineering-os/recover-orphaned-mission \
              --events "$RUNNER_TEMP/events-${issue}.json" \
              --now "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_STEP_SUMMARY"
          done

  recover:
    needs: [policy, discover]
    if: ${{ success() && github.event_name != 'schedule' && inputs.dry_run == false && inputs.issue_number != 0 && inputs.issue_number != '' && needs.policy.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Materialize immutable enforcement kernel
        uses: josephmccann/AIFO-Control-Plane/.github/actions/materialize-kernel@672160e2e2e1bbf783e3b4ff5d5771a2806a4e35
        with:
          expected_kernel_sha: 672160e2e2e1bbf783e3b4ff5d5771a2806a4e35
      - name: Check out target repository default branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          path: target
          fetch-depth: 1
          persist-credentials: false
      - name: Re-fetch and revalidate chain immediately before atomic append
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRY_RUN: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PYTHONPATH: ${{ github.workspace }}/kernel
          SOURCE_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "issue number must be a positive integer" >&2; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > "$RUNNER_TEMP/issue.json"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" | jq 'add' > "$RUNNER_TEMP/comments-latest.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > "$RUNNER_TEMP/current-run.json"
          python3 - <<'PY'
          import json
          import os
          import re
          from engineering_os.commands import _EVENT_MARKER
          from engineering_os.mission import parse_issue_body
          issue = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "issue.json"), encoding="utf-8"))
          json.dump(parse_issue_body(issue["body"]), open(os.path.join(os.environ["RUNNER_TEMP"], "mission.json"), "w", encoding="utf-8"))
          comments = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "comments-latest.json"), encoding="utf-8"))
          pattern = re.compile(r"https://github\.com/%s/actions/runs/([1-9][0-9]*)" % re.escape(os.environ["GITHUB_REPOSITORY"]))
          run_ids = set()
          for comment in comments:
              for match in _EVENT_MARKER.finditer(comment.get("body", "")):
                  try:
                      event = json.loads(match.group(1))
                  except json.JSONDecodeError:
                      continue
                  found = pattern.fullmatch(event.get("source_url", "") if isinstance(event, dict) else "")
                  if found:
                      run_ids.add(int(found.group(1)))
          with open(os.path.join(os.environ["RUNNER_TEMP"], "run-ids-latest.txt"), "w", encoding="utf-8") as stream:
              stream.writelines("%s\n" % run_id for run_id in sorted(run_ids))
          PY
          : > "$RUNNER_TEMP/runs-latest.ndjson"
          while read -r run_id; do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >> "$RUNNER_TEMP/runs-latest.ndjson"
          done < "$RUNNER_TEMP/run-ids-latest.txt"
          if [[ -s "$RUNNER_TEMP/runs-latest.ndjson" ]]; then jq -s '.' "$RUNNER_TEMP/runs-latest.ndjson" > "$RUNNER_TEMP/runs-latest.json"; else printf '[]\n' > "$RUNNER_TEMP/runs-latest.json"; fi
          gh api "repos/${GITHUB_REPOSITORY}/contents/.aifo/engineering-os-policy.json?ref=${DEFAULT_BRANCH}" --jq .content \
            | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/policy-current.json"
          python3 - <<'PY'
          import json
          import os
          from engineering_os.commands import recovery_mutation_allowed, validate_recovery_run
          from engineering_os.schema import validate_document
          policy = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "policy-current.json"), encoding="utf-8"))
          violations = validate_document("repository-policy", policy)
          if violations:
              raise SystemExit("current default-branch repository policy is invalid")
          dry_run = os.environ["DRY_RUN"].lower() == "true"
          if not recovery_mutation_allowed(os.environ["EVENT_NAME"], dry_run, policy):
              raise SystemExit("live recovery mutation gate is closed")
          run = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "current-run.json"), encoding="utf-8"))
          if not validate_recovery_run(run, os.environ["GITHUB_REPOSITORY"], os.environ["SOURCE_URL"], policy):
              raise SystemExit("current recovery workflow run metadata is invalid")
          PY
          python3 -m engineering_os.commands authenticate-event-history \
            --comments "$RUNNER_TEMP/comments-latest.json" \
            --mission "$RUNNER_TEMP/mission.json" \
            --policy "$RUNNER_TEMP/policy-current.json" \
            --runs "$RUNNER_TEMP/runs-latest.json" \
            --repository "$GITHUB_REPOSITORY" \
            --events-output "$RUNNER_TEMP/events-latest.json"
          NOW="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" python3 - <<'PY'
          import json
          import os
          from engineering_os.canonical import content_sha256
          from engineering_os.commands import validate_event_chain
          from engineering_os.lease import find_orphans, release_mission
          from engineering_os.state import authorize_transition, project_state

          events = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "events-latest.json"), encoding="utf-8"))
          policy = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "policy-current.json"), encoding="utf-8"))
          mission = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "mission.json"), encoding="utf-8"))
          orphans = [item for item in find_orphans(events, now=os.environ["NOW"]) if item.mission_id == mission["mission_id"]]
          if len(orphans) != 1:
              raise SystemExit("lease is no longer an orphan; refusing raced recovery")
          orphan = orphans[0]
          recovery = release_mission(
              events, mission_id=orphan.mission_id, owner="system",
              now=os.environ["NOW"], nonce=orphan.nonce, recovery=True,
          )
          if not recovery.allowed:
              raise SystemExit(recovery.code)
          projection = project_state(events, policy)
          previous = events[-1]["event_hash"] if events else None
          audited = []
          for offset, proposal in enumerate(recovery.events, start=1):
              authorized = authorize_transition(projection, proposal, policy)
              if not authorized.allowed:
                  raise SystemExit(authorized.code)
              event = dict(proposal)
              event.update({
                  "schema_version": "1.0.0", "sequence": len(events) + offset,
                  "source_url": os.environ["SOURCE_URL"], "previous_event_hash": previous,
              })
              event["event_hash"] = content_sha256(event)
              audited.append(event)
              previous = event["event_hash"]
              projection = project_state(events + audited, policy)
              if projection.violations:
                  raise SystemExit("recovery projection contains violations")
          valid, code = validate_event_chain(events + audited)
          if not valid:
              raise SystemExit(code)
          body = "\n".join(
              "<!-- EOS:EVENT:BEGIN -->\n%s\n<!-- EOS:EVENT:END -->" % json.dumps(event, sort_keys=True, separators=(",", ":"))
              for event in audited
          )
          open(os.path.join(os.environ["RUNNER_TEMP"], "recovery-body.txt"), "w", encoding="utf-8").write(body + "\n")
          PY
          body="$(< "$RUNNER_TEMP/recovery-body.txt")"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="$body" >/dev/null
          printf '%s\n' '{"dry_run":false,"mutation_performed":true}' >> "$GITHUB_STEP_SUMMARY"
