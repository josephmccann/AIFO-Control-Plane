name: Engineering OS Test Integrity

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

jobs:
  test-integrity:
    name: Test Integrity
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    uses: josephmccann/AIFO-Control-Plane/.github/workflows/reusable-test-integrity.yml@ece0dccb7dd3d08424ffe31491d1d3ab3106bb8d
    with:
      expected_workflow_sha: ece0dccb7dd3d08424ffe31491d1d3ab3106bb8d
