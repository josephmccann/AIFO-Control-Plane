name: Engineering OS Test Integrity

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

jobs:
  test-integrity:
    name: Test Integrity
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    uses: josephmccann/AIFO-Control-Plane/.github/workflows/reusable-test-integrity.yml@adc986a77cd2bc2d50eed0085f6adfe9decc227e
    with:
      expected_workflow_sha: adc986a77cd2bc2d50eed0085f6adfe9decc227e
