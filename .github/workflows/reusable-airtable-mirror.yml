name: Reusable Airtable reporting mirror

on:
  workflow_call:
    inputs:
      missions_json:
        required: true
        type: string
      projected_at:
        required: true
        type: string
      mode:
        required: false
        type: string
        default: dry-run
      expected_workflow_sha:
        description: Exact reviewed Control Plane workflow revision
        required: true
        type: string

permissions: {}

jobs:
  caller-authorization:
    name: Authorize exact caller and workflow provenance
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail closed unless caller and workflow are authorized
        env:
          CALLER_EVENT_NAME: ${{ github.event_name }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_OWNER: ${{ github.repository_owner }}
          CALLER_REF: ${{ github.ref }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
          EXPECTED_WORKFLOW_FILE_PATH: .github/workflows/reusable-airtable-mirror.yml
          EXPECTED_CALLER_WORKFLOW_PATH: .github/workflows/eos-airtable-mirror.yml
        run: |
          set -euo pipefail
          deny() { echo "caller authorization denied: $1" >&2; exit 1; }
          [[ "$CALLER_OWNER" == "josephmccann" ]] || deny "repository owner"
          [[ "$CALLER_REPOSITORY" == "josephmccann/AI.FO-Demo" ]] || deny "calling repository"
          [[ "$WORKFLOW_REPOSITORY" == "josephmccann/AIFO-Control-Plane" ]] || deny "workflow repository"
          [[ "$WORKFLOW_FILE_PATH" == "$EXPECTED_WORKFLOW_FILE_PATH" ]] || deny "workflow identity"
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || deny "workflow revision"
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || deny "expected evidence"
          [[ "$WORKFLOW_SHA" == "$EXPECTED_WORKFLOW_SHA" ]] || deny "workflow provenance"
          [[ "$CALLER_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || deny "caller workflow revision"
          [[ "$CALLER_EVENT_NAME" == "schedule" || "$CALLER_EVENT_NAME" == "workflow_dispatch" ]] || deny "event"
          [[ "$CALLER_REF" == "refs/heads/master" ]] || deny "caller ref"
          [[ "$CALLER_WORKFLOW_REF" == "$CALLER_REPOSITORY/$EXPECTED_CALLER_WORKFLOW_PATH@$CALLER_REF" ]] || deny "caller workflow identity"

  dry-run:
    name: Airtable mirror dry run
    needs: caller-authorization
    if: ${{ success() && inputs.mode == 'dry-run' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Materialize immutable mirror kernel
        uses: josephmccann/AIFO-Control-Plane/.github/actions/materialize-kernel@8a20154390e76683871c0bc6b1fd27bafaff7cb3
        with:
          expected_kernel_sha: 8a20154390e76683871c0bc6b1fd27bafaff7cb3

      - name: Materialize closed mission projections
        env:
          MISSIONS_JSON: ${{ inputs.missions_json }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/eos-airtable"
          printf '%s' "$MISSIONS_JSON" >"$RUNNER_TEMP/eos-airtable/missions.json"

      - name: Generate redacted deterministic mirror
        env:
          PROJECTED_AT: ${{ inputs.projected_at }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel"
          scripts/engineering-os/sync-airtable \
            --direction github_to_airtable \
            --mode dry-run \
            --missions "$RUNNER_TEMP/eos-airtable/missions.json" \
            --projected-at "$PROJECTED_AT" \
            --output "$RUNNER_TEMP/eos-airtable/records.json"

      - name: Retain dry-run reporting artifact
        uses: actions/upload-artifact@v4
        with:
          name: eos-airtable-dry-run
          path: ${{ runner.temp }}/eos-airtable/records.json
          if-no-files-found: error
          retention-days: 30

  live-disabled:
    name: Airtable live mirror is not activated
    needs: caller-authorization
    if: ${{ success() && inputs.mode != 'dry-run' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo "Live Airtable writes require a future authenticated environment adapter." >&2
          exit 1
