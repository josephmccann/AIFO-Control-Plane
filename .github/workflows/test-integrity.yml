name: Engineering OS Test Integrity

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

jobs:
  test-integrity:
    name: Test Integrity
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    uses: josephmccann/AIFO-Control-Plane/.github/workflows/reusable-test-integrity.yml@efec01618233249bb55061032e36ffc2fb81372e
    with:
      expected_workflow_sha: efec01618233249bb55061032e36ffc2fb81372e
