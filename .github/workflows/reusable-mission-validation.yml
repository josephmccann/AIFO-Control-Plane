name: Reusable mission validation

on:
  workflow_call:
    inputs:
      issue_number:
        description: Mission issue number
        required: true
        type: number

permissions: {}

jobs:
  mission-history:
    name: Mission history
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
    steps:
      - name: Check out immutable enforcement kernel
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: kernel
          fetch-depth: 1
          persist-credentials: false
      - name: Check out immutable target base revision
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: target
          fetch-depth: 1
          persist-credentials: false
      - name: Read and flatten authenticated issue history
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PYTHONPATH: ${{ github.workspace }}/kernel
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > "$RUNNER_TEMP/issue.json"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" | jq 'add' > "$RUNNER_TEMP/comments.json"
          python3 - <<'PY'
          import json
          import os
          import re
          from engineering_os.commands import _EVENT_MARKER
          from engineering_os.mission import parse_issue_body
          issue = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "issue.json"), encoding="utf-8"))
          json.dump(parse_issue_body(issue["body"]), open(os.path.join(os.environ["RUNNER_TEMP"], "mission.json"), "w", encoding="utf-8"))
          comments = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "comments.json"), encoding="utf-8"))
          pattern = re.compile(r"https://github\.com/%s/actions/runs/([1-9][0-9]*)" % re.escape(os.environ["GITHUB_REPOSITORY"]))
          run_ids = set()
          for comment in comments:
              for match in _EVENT_MARKER.finditer(comment.get("body", "")):
                  try:
                      event = json.loads(match.group(1))
                  except json.JSONDecodeError:
                      continue
                  found = pattern.fullmatch(event.get("source_url", "") if isinstance(event, dict) else "")
                  if found:
                      run_ids.add(int(found.group(1)))
          with open(os.path.join(os.environ["RUNNER_TEMP"], "run-ids.txt"), "w", encoding="utf-8") as stream:
              stream.writelines("%s\n" % run_id for run_id in sorted(run_ids))
          PY
          : > "$RUNNER_TEMP/runs.ndjson"
          while read -r run_id; do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >> "$RUNNER_TEMP/runs.ndjson"
          done < "$RUNNER_TEMP/run-ids.txt"
          if [[ -s "$RUNNER_TEMP/runs.ndjson" ]]; then jq -s '.' "$RUNNER_TEMP/runs.ndjson" > "$RUNNER_TEMP/runs.json"; else printf '[]\n' > "$RUNNER_TEMP/runs.json"; fi
      - name: Authenticate event history, authority, and projection
        env:
          PYTHONPATH: ${{ github.workspace }}/kernel
        run: |
          python3 -m engineering_os.commands authenticate-event-history \
            --comments "$RUNNER_TEMP/comments.json" \
            --mission "$RUNNER_TEMP/mission.json" \
            --policy target/.aifo/engineering-os-policy.json \
            --runs "$RUNNER_TEMP/runs.json" \
            --repository "$GITHUB_REPOSITORY"

  tier-path:
    name: Tier and path guard
    needs: mission-history
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/reusable-tier-path-guard.yml
    with:
      issue_number: ${{ inputs.issue_number }}

  frozen-path:
    name: Frozen path guard
    needs: mission-history
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/reusable-frozen-path-guard.yml
    with:
      issue_number: ${{ inputs.issue_number }}

  test-integrity:
    name: Test integrity
    needs: mission-history
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/reusable-test-integrity.yml

  evidence:
    name: Evidence manifest
    needs: [mission-history, tier-path, frozen-path, test-integrity]
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/reusable-evidence-manifest.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      pull_request: ${{ github.event.pull_request.number }}

  merge-authorization:
    name: Merge authorization
    needs: [mission-history, tier-path, frozen-path, test-integrity, evidence]
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/reusable-merge-authorization.yml
