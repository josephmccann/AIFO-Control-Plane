name: Engineering OS Test Integrity

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

jobs:
  test-integrity:
    name: Test Integrity
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    uses: josephmccann/AIFO-Control-Plane/.github/workflows/reusable-test-integrity.yml@6662dd3b2dbf9a4acce235ac5f1406f2842eee0e
    with:
      expected_workflow_sha: 6662dd3b2dbf9a4acce235ac5f1406f2842eee0e
