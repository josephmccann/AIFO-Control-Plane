name: Engineering OS Test Integrity

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

jobs:
  test-integrity:
    name: Test Integrity
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    uses: josephmccann/AIFO-Control-Plane/.github/workflows/reusable-test-integrity.yml@e1336ae17626aa05c0725221d7b9b7e304ca283c
    with:
      expected_workflow_sha: e1336ae17626aa05c0725221d7b9b7e304ca283c
