name: Engineering OS Test Integrity

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

jobs:
  test-integrity:
    name: Test Integrity
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    uses: josephmccann/AIFO-Control-Plane/.github/workflows/reusable-test-integrity.yml@9ac84dc199bb0e083cc179b98d9e74a1458c7f65
    with:
      expected_workflow_sha: 9ac84dc199bb0e083cc179b98d9e74a1458c7f65
