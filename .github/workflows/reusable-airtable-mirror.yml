name: Reusable Airtable reporting mirror

on:
  workflow_call:
    inputs:
      missions_json:
        required: true
        type: string
      projected_at:
        required: true
        type: string
      mode:
        required: false
        type: string
        default: dry-run

permissions: {}

jobs:
  dry-run:
    name: Airtable mirror dry run
    if: ${{ inputs.mode == 'dry-run' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out immutable mirror kernel
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: kernel
          persist-credentials: false

      - name: Materialize closed mission projections
        env:
          MISSIONS_JSON: ${{ inputs.missions_json }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/eos-airtable"
          printf '%s' "$MISSIONS_JSON" >"$RUNNER_TEMP/eos-airtable/missions.json"

      - name: Generate redacted deterministic mirror
        env:
          PROJECTED_AT: ${{ inputs.projected_at }}
        run: |
          set -euo pipefail
          kernel/scripts/engineering-os/sync-airtable \
            --direction github_to_airtable \
            --mode dry-run \
            --missions "$RUNNER_TEMP/eos-airtable/missions.json" \
            --projected-at "$PROJECTED_AT" \
            --output "$RUNNER_TEMP/eos-airtable/records.json"

      - name: Retain dry-run reporting artifact
        uses: actions/upload-artifact@v4
        with:
          name: eos-airtable-dry-run
          path: ${{ runner.temp }}/eos-airtable/records.json
          if-no-files-found: error
          retention-days: 30

  live-disabled:
    name: Airtable live mirror is not activated
    if: ${{ inputs.mode != 'dry-run' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo "Live Airtable writes require a future authenticated environment adapter." >&2
          exit 1
